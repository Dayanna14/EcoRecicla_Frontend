<div class="contenedor">
  <div class="encabezado">
    <div>
      <h1>Roles</h1>
      <p class="subtitulo">Gestiona los perfiles de acceso de la plataforma.</p>
    </div>
    <a mat-flat-button routerLink="/roles/insertar">Registrar rol</a>
  </div>

  <div class="tarjeta">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element" class="mono">{{ element.idRol }}</td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element" class="nombre">{{ element.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <!-- Editar: se conecta en HUF06 -->
          <button mat-icon-button class="btn-editar" aria-label="Editar rol">
            <mat-icon>edit</mat-icon>
          </button>
          <!-- Eliminar: se conecta en HUF07 -->
          <button mat-icon-button class="btn-eliminar" aria-label="Eliminar rol">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="sin-datos" [attr.colspan]="displayedColumns.length">
          No hay roles registrados.
        </td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
  </div>
</div>
