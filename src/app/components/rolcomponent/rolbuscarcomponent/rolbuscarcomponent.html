<div class="contenedor">
  <div class="encabezado">
    <h1>Buscar roles</h1>
    <p class="subtitulo">Escribe el nombre o parte del nombre del rol.</p>
  </div>

  <div class="tarjeta">
    <label class="etiqueta" for="nombreBuscado">Nombre del rol</label>
    <div class="buscador">
      <mat-form-field appearance="outline" class="campo" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          id="nombreBuscado"
          [(ngModel)]="nombreBuscado"
          placeholder="administrador"
          (keyup.enter)="buscarPorNombre()"
        />
      </mat-form-field>

      <button mat-flat-button class="btn-buscar" (click)="buscarPorNombre()">
        <mat-icon>search</mat-icon>
        Buscar
      </button>
    </div>

    @if (dataSource.length > 0) {
      <p class="resultados">
        <strong>{{ dataSource.length }}</strong> resultado(s) encontrados
      </p>

      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="c1">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element" class="mono">{{ element.idRol }}</td>
        </ng-container>

        <ng-container matColumnDef="c2">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element" class="nombre">{{ element.nombre }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    } @else {
      <div class="vacio">
        <mat-icon>manage_search</mat-icon>
        <p>Ingresa un nombre y pulsa <strong>Buscar</strong>.</p>
      </div>
    }
  </div>
</div>
