<div class="container">
  <div>
    <h2>Cantidad de Canjes por Usuario</h2>
  </div>

  @if (lista.length > 0) {
    <div style="position: relative; height: 400px; width: 100%;">
      <canvas
        baseChart
        [data]="chartData"
        [options]="chartOptions"
        [type]="chartType">
      </canvas>
    </div>
  } @else {
    <p>No hay datos registrados para mostrar en el reporte.</p>
  }
</div>
